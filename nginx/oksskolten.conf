# Unified Nginx config for Oksskolten UIs + API proxy.
#
# This file replaces:
# - nginx/frontend.conf
# - nginx/mrrss-frontend.conf
# - previous proxy-only nginx/oksskolten.conf
#
# UI selection:
# - Default host serves original UI from /usr/share/nginx/html
# - Host "mrrss.local" serves alternative UI from /usr/share/nginx/mrrss
#
# API:
# - /api/* is proxied to backend service "server:3000"

map $host $ui_root {
    default /usr/share/nginx/html;
    mrrss.local /usr/share/nginx/mrrss;
}

upstream oksskolten_api {
    server server:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 10m;
    root $ui_root;
    index index.html;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Streaming endpoints use SSE. Disable buffering for live token streams.
    location /api/ {
        proxy_pass http://oksskolten_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    # SPA fallback for each UI.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
