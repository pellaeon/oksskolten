services:
  server:
    # Option A: Build locally (default)
    build:
      target: runtime-compiled-api
    # Option B: Use pre-built image from GHCR (comment out "build" above and uncomment below)
    # image: ghcr.io/babarot/oksskolten:latest
    command: []
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes: !override
      - ${DATA_DIR:-./data}:/data
    ports: !override []
    expose:
      - "3000"

  meilisearch:
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    ports: !override []

  rss-bridge:
    ports: !override []

  flaresolverr:
    ports: !override []

  frontend:
    build:
      target: runtime-frontend
    command: []
    restart: unless-stopped
    volumes: !override []
    ports: !override
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      server:
        condition: service_healthy

  frontend-mrrss:
    build:
      target: runtime-mrrss-frontend
    command: []
    restart: unless-stopped
    volumes: !override []
    ports: !override
      - "${MRRSS_FRONTEND_PORT:-5174}:80"
    depends_on:
      server:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    networks:
      - internal
    restart: unless-stopped
